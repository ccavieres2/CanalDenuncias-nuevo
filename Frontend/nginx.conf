# Producción: sirve la app compilada y reenvía /api al backend, con las cabeceras de seguridad.
# Las cabeceras deben coincidir con prodHeaders de security-headers.ts.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Tamaño máximo de una petición (el logo de la marca llega a ~450 KB en base64).
  client_max_body_size 1m;

  # Las cabeceras de seguridad van en cada «location» (en nginx, un add_header dentro de una location reemplaza a
  # los del server). La API no las repite aquí: las pone el backend (helmet).

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Evidencias del denunciante: única ruta que admite hasta 10 MB (el backend valida el límite exacto).
  location ~ ^/api/t/[a-z0-9-]+/public/track/files$ {
    client_max_body_size 11m;
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché para siempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta carga index.html (sin caché, para tomar siempre la última versión).
  location / {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri /index.html;
  }
}
